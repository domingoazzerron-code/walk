document.addEventListener("change",e=>{if(e.target.id==="avp"){const f=e.target.files[0];if(f)shrink(f,256).then(u=>{S.avatar=u;save();render();sheetA()}).catch(()=>toast("Couldn’t read that photo"));return}if(e.target.id==="pname"){S.name=e.target.value.trim().slice(0,24);save();render();return}if(e.target.id==="wph"){const f=e.target.files[0];if(f)shrink(f).then(u=>{curPhoto=u;$("#pbox").innerHTML=pbx()}).catch(()=>toast("Couldn’t read that photo"));return}if(e.target.id==="rt"){S.remT=e.target.value||"17:30";save();return}if(e.target.id==="cur"){S.cur=e.target.value;save();render(3)}if(e.target.id==="wgoal"){const v=parseFloat(e.target.value);S.wg=v>0?v/uf():0;save();render(3);toast("Weekly goal updated");return}if(e.target.id==="stride"){const v=parseFloat(e.target.value);if(!(v>=30&&v<=150)){e.target.value=S.stride>0?S.stride:75;toast("Enter a step length from 30 to 150 cm");return}S.stride=v;save();render(3);toast("Step length updated");return}if(e.target.id==="goal"){const v=parseFloat(e.target.value);if(!(v>0)||v>200){e.target.value=+(S.goal*uf()).toFixed(1);toast("Enter a goal above 0");return}{const ng=v/uf();if(Math.abs(ng-S.goal)>1e-9){S.gh=S.gh||[];if(!S.gh.length)S.gh.push({d:"0000-01-01",g:S.goal});const td=iso(today()),l=S.gh[S.gh.length-1];if(l.d===td)l.g=ng;else S.gh.push({d:td,g:ng});S.goal=ng}}save();render(3);toast("Daily goal updated")}});
const updPace=()=>{const k=parseFloat($("#wkm").value),m=parseFloat($("#wmn").value),el=$("#pc");if(el)el.textContent=k>0&&m>0?`Pace ${pace({km:k/uf(),min:m})} · ${spd(k/uf(),m)}`:""};
document.addEventListener("input",e=>{const id=e.target.id;if(id==="wq"){wq=e.target.value;clearTimeout(qt);qt=setTimeout(czRefresh,160);return}
 if(id==="wst"){const km=$("#wkm"),es=$("#es"),n=parseInt(e.target.value)||0;if(km&&(!km.value||km.dataset.auto)){if(n>0){km.value=+(n*stl()/1000*uf()).toFixed(2);km.dataset.auto=1;if(es)es.textContent=`Distance estimated from steps (${S.stride>0?S.stride:75} cm step). Edit it if you know better.`}else{km.value="";delete km.dataset.auto;if(es)es.textContent=""}updPace()}return}
 if(id==="wkm"){delete e.target.dataset.auto;const es=$("#es");if(es)es.textContent=""}
 if(id==="wkm"||id==="wmn")updPace()});
setInterval(()=>{const e=document.getElementById("clk");if(e&&S.timer)e.textContent=fmtT(Date.now()-S.timer.start)},1000);
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});

let sx=0,sy=0;const vp=$(".vp");
vp.addEventListener("touchstart",e=>{sw=!e.target.closest(".stk,.chips,.pre,.mg,.pbars,[data-sw],input,textarea,select");sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
vp.addEventListener("touchend",e=>{if(!sw)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6){const n=idx+(dx<0?1:-1);if(n>=0&&n<T.length)go(n)}},{passive:true});

ld=iso(today());
const chk=()=>{if(iso(today())===ld)return;ld=iso(today());S.subs.forEach(s=>{if(s.on)s.next=iso(nextD(s))});calM=null;save();render()};
document.addEventListener("visibilitychange",()=>{if(!document.hidden)chk()});setInterval(chk,60000);
if(!S.fu)S.fu=iso(today());S.subs.forEach(s=>{if(s.on)s.next=iso(nextD(s))});applyTheme();save();render();
go(Math.max(0,T.indexOf(location.hash.slice(1))));
phLoadAll().then(async ok=>{if(!ok)return;await phMigrate();phGC();render()});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
